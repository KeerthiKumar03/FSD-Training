<!-- Registration Form -->

<section class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow-lg">

<div class="card-header bg-primary text-white">

<h3 class="text-center">

Event Registration

</h3>

</div>

<div class="card-body">

<form id="registrationForm">

<div class="mb-3">

<label class="form-label">
Student Name
</label>

<input type="text"
class="form-control"
id="name"
required>

</div>

<div class="mb-3">

<label class="form-label">
Roll Number
</label>

<input type="text"
class="form-control"
id="roll"
required>

</div>

<div class="mb-3">

<label class="form-label">
Branch
</label>

<select class="form-select"
id="branch"
required>

<option value="">Select Branch</option>

<option>CSE</option>

<option>ECE</option>

<option>EEE</option>

<option>MECH</option>

<option>CIVIL</option>

<option>IT</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Email
</label>

<input type="email"
class="form-control"
id="email"
required>

</div>

<div class="mb-3">

<label class="form-label">
Mobile Number
</label>

<input type="tel"
class="form-control"
id="mobile"
pattern="[0-9]{10}"
required>

</div>

<div class="mb-3">

<label class="form-label">
Select Event
</label>

<select class="form-select"
id="event"
required>

<option value="">Choose Event</option>

<option>Technical Quiz</option>

<option>Hackathon</option>

<option>Poster Presentation</option>

<option>Coding Contest</option>

<option>Project Expo</option>

<option>Cultural Fest</option>

</select>

</div>

<div class="d-grid">

<button class="btn btn-success btn-lg">

Register Now

</button>

</div>

</form>

<!-- Success Alert -->

<div id="successMessage"
class="alert alert-success mt-4 d-none">

🎉 Registration Successful!

Thank you for registering.

</div>

</div>

</div>

</div>

</div>
