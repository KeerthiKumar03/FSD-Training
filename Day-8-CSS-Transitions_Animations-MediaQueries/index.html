<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions and Animations</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>CSS Transitions and Animations Practice</h1>

    <!-- Transition Examples -->
    <section>
        <h2>Transition Effects</h2>

        <div class="box"></div>

        <button class="btn">Hover Me</button>

        <div class="card">
            <h3>Card</h3>
            <p>Move your mouse over me!</p>
        </div>
    </section>

    <!-- Animation Examples -->
    <section>
        <h2>Animation Effects</h2>

        <div class="loader"></div>

        <div class="ball"></div>

        <div class="square"></div>

    </section>

</body>
</html>
