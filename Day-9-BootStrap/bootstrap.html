<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Practice</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">My Website</a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>


    <div class="container mt-5">

        <!-- Alert -->
        <div class="alert alert-success">
            Welcome to Bootstrap Practice!
        </div>

        <!-- Buttons -->
        <h2>Buttons</h2>

        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-success">Success</button>
        <button class="btn btn-danger">Danger</button>
        <button class="btn btn-warning">Warning</button>


        <!-- Grid -->
        <h2 class="mt-5">Grid System</h2>

        <div class="row">
            <div class="col-md-4 bg-primary text-white p-4">
                Column 1
            </div>

            <div class="col-md-4 bg-success text-white p-4">
                Column 2
            </div>

            <div class="col-md-4 bg-danger text-white p-4">
                Column 3
            </div>
        </div>


        <!-- Cards -->
        <h2 class="mt-5">Cards</h2>

        <div class="row">

            <div class="col-md-4">
                <div class="card shadow">
                    <img src="https://picsum.photos/300/200"
                         class="card-img-top">

                    <div class="card-body">
                        <h5 class="card-title">Bootstrap Card</h5>

                        <p class="card-text">
                            This is a sample card.
                        </p>

                        <button class="btn btn-primary">
                            Read More
                        </button>
                    </div>
                </div>
            </div>

        </div>


        <!-- Table -->
        <h2 class="mt-5">Table</h2>

        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Branch</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>1</td>
                    <td>Keerthi</td>
                    <td>CSE-DS</td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>Rahul</td>
                    <td>CSE</td>
                </tr>
            </tbody>
        </table>


        <!-- Progress Bar -->
        <h2 class="mt-5">Progress Bar</h2>

        <div class="progress">
            <div class="progress-bar bg-success"
                 style="width:70%">
                70%
            </div>
        </div>


        <!-- Form -->
        <h2 class="mt-5">Form</h2>

        <form>
            <div class="mb-3">
                <label class="form-label">Name</label>

                <input type="text"
                       class="form-control"
                       placeholder="Enter name">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>

                <input type="email"
                       class="form-control"
                       placeholder="Enter email">
            </div>

            <button class="btn btn-success">
                Submit
            </button>
        </form>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
