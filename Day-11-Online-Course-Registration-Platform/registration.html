<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <!-- Added official Bootstrap 5 CDN Links -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">LearnHub</a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Menu -->
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
         <li class="nav-item ms-2">
          <a href="login.html" class="btn btn-primary">Login</a>
        </li>

          <li class="nav-item ms-2 active">
          <a  href="signup.html" class="btn btn-primary">SignUp</a>
        </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Added a container bootstrap class for padding and centering -->
  <div class="container my-5" style="max-width: 600px;">
    <form id="reistrationForm" class="needs-validation registration-from" novalidate>
      <fieldset>
        <legend class="mb-4">Fill the Registration Form</legend>
        
        <!-- Name -->
        <div class="mb-3">
          <label for="name" class="form-label">Student Name</label>
          <input type="text" id="name" class="form-control" placeholder="Enter Your name" required>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="Email" class="form-label">Email</label>
          <input type="email" id="Email" class="form-control" placeholder="Enter your email" required>
        </div>

        <!-- Mobile Number -->
        <div class="mb-3">
          <label for="mobile" class="form-label">Mobile Number</label>
          <!-- Changed to type="tel" for better mobile keyboard rendering -->
          <input type="tel" id="mobile" class="form-control" placeholder="Enter mobile Number" required>
        </div>

        <!-- Gender (Fixed: All options grouped together inside the mb-3 container) -->
        <div class="mb-3">
          <label class="form-label d-block">Gender</label>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female" required>
            <label class="form-check-label" for="genderFemale">Female</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male">
            <label class="form-check-label" for="genderMale">Male</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" id="genderNonBinary" value="non-binary">
            <label class="form-check-label" for="genderNonBinary">Non-binary</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" id="genderPreferNotToSay" value="prefer-not-to-say">
            <label class="form-check-label" for="genderPreferNotToSay">Prefer not to say</label>
          </div>
        </div>

        <!-- Course Selection -->
        <div class="mb-3">
          <label for="courseSelectMenu" class="form-label">Course</label>
          <select class="form-select" id="courseSelectMenu" required name="course">
            <option selected disabled value="">Choose your Course...</option>
            <option value="web dev">Web Development</option>
            <option value="DS">Data Science</option>
            <option value="python">Python Programming</option>
            <option value="AI & ML">AI & Machine Learning</option>
            <option value="java">Java Programming</option>
            <option value="cloud">Cloud Computing</option>
          </select>
          <div class="invalid-feedback">Please select an option from the menu.</div>
        </div>

        <!-- Qualification (Fixed: Label text updated) -->
        <div class="mb-3">
          <label for="qualification" class="form-label">Qualification</label>
          <select class="form-select" id="qualification" required name="Qualification">
            <option selected disabled value="">Your Qualification</option>
            <option value="mtech">M.Tech</option>
            <option value="btech">B.Tech</option>
            <option value="inter">Intermediate</option>
            <option value="others">Others</option>
          </select>
          <div class="invalid-feedback">Please select your qualification.</div>
        </div>

        <!-- Address -->
        <div class="mb-3">
          <label for="inputAddress" class="form-label">Address Line</label>
          <input type="text" class="form-control" id="inputAddress" name="address" placeholder="123 Main St" required>
        </div>

        <!-- Grid layout (Fixed: class="row g-3") -->
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label for="inputCity" class="form-label">City</label>
            <input type="text" class="form-control" id="inputCity" name="city" placeholder="Hyderabad" required>
          </div>
          <div class="col-md-4">
            <label for="inputState" class="form-label">State / Region</label>
            <select id="inputState" class="form-select" name="state" required>
              <option selected disabled value="">Choose...</option>
              <option value="state1">Telangana</option>
              <option value="state2">Andhra Pradesh</option>
              <option value="state3">Haryana</option>
              <option value="state4">Himachal Pradesh</option>
              <option value="state5">Tamilnadu</option>
            </select>
          </div>
          <div class="col-md-2">
            <label for="inputZip" class="form-label">Zip</label>
            <input type="text" class="form-control" id="inputZip" name="zip" required>
          </div>
        </div>

        <!-- Terms and Conditions (Fixed: Cleaned up link elements) -->
        <div class="mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="agree" required>
            <label class="form-check-label" for="agree">
              I agree to the <a href="/terms" target="_blank" class="text-decoration-none">Terms and Conditions</a> and <a href="/privacy" target="_blank" class="text-decoration-none">Privacy Policy</a>.
            </label>
            <div class="invalid-feedback">You must agree to the terms and conditions before submitting.</div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Register</button>
      </fieldset>
    </form>
  </div>

  <!-- Added JavaScript Bundle link for navbar toggles -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.js"></script>
</body>
</html>
