
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - LearnHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f4f7fc, #e8f0fe);
            min-height: 100vh;
        }

        .signup-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: #0d6efd;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card signup-card p-4">

                <div class="card-body">

                    <h2 class="text-center logo mb-4">
                        LearnHub
                    </h2>

                    <h4 class="text-center mb-4">
                        Create Account
                    </h4>

                    <form id="signupForm">

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   placeholder="Enter your name"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input type="email"
                                   class="form-control"
                                   placeholder="Enter email"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Mobile Number
                            </label>

                            <input type="tel"
                                   class="form-control"
                                   placeholder="Enter mobile number"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   placeholder="Create password"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Confirm Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   placeholder="Confirm password"
                                   required>

                        </div>

                        <div class="form-check mb-3">

                            <input type="checkbox"
                                   class="form-check-input"
                                   required>

                            <label class="form-check-label">

                                I agree to the Terms &
                                Conditions

                            </label>

                        </div>

                        <button class="btn btn-success w-100"
                                type="submit">

                            Create Account

                        </button>

                    </form>

                    <p class="text-center mt-3">

                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

document.getElementById("signupForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    const passwords =
    document.querySelectorAll(
        'input[type="password"]'
    );

    if(passwords[0].value !== passwords[1].value){

        alert("Passwords do not match!");

        return;
    }

    alert("Account Created Successfully!");

    window.location.href = "login.html";

});

</script>

</body>
</html>
