<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Survey</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>

    <nav class="navbar">

        <div class="logo">
            <h1>Society Election System</h1>
        </div>

    </nav>

</header>

<section class="register-section">

    <div class="form-container">

        <h2>Society Survey</h2>

        <form>

            <label>Cleanliness Satisfaction</label>

            <div class="radio-group">

                <input type="radio" name="clean">
                <span>Excellent</span>

                <input type="radio" name="clean">
                <span>Good</span>

                <input type="radio" name="clean">
                <span>Poor</span>

            </div>

            <label>Parking Issues</label>

            <select>

                <option>Select Option</option>
                <option>Yes</option>
                <option>No</option>

            </select>

            <label>Security Feedback</label>

            <textarea rows="5" placeholder="Enter feedback"></textarea>

            <button class="btn">
                Submit Survey
            </button>

        </form>

    </div>

</section>

<footer>

    <p>© 2026 Society Election Management System</p>

</footer>

</body>
</html>
