<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Society Survey</title>

    <link rel="stylesheet" href="css/survey.css">
</head>
<body>

<header class="header">

    <h1>Society Election System</h1>

    <nav>

        <ul class="nav-links">

            <li><a href="index.html">Home</a></li>

            <li><a href="survey.html">Survey</a></li>

            <li><a href="polls.html">Polls</a></li>

            <li><a href="results.html">Results</a></li>

        </ul>

    </nav>

</header>

<section class="survey-section">

    <h2>Society Feedback Survey</h2>

    <form class="survey-form">

        <label>
            How satisfied are you with cleanliness?
        </label>

        <div class="radio-group">

            <input type="radio" name="cleanliness">
            <span>Excellent</span>

            <input type="radio" name="cleanliness">
            <span>Good</span>

            <input type="radio" name="cleanliness">
            <span>Average</span>

        </div>

        <label>
            Are there parking issues?
        </label>

        <select>

            <option>Select Option</option>

            <option>Yes</option>

            <option>No</option>

        </select>

        <label>
            Security Feedback
        </label>

        <textarea
            rows="5"
            placeholder="Enter your feedback">
        </textarea>

        <button class="btn">
            Submit Survey
        </button>

    </form>

</section>

<footer>

    <p>
        © 2026 Society Election System
    </p>

</footer>

</body>
</html>
