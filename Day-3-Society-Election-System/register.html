<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register-Society Election System</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .navbar {
    background-color: #5b73b9;
    display: flex;
    justify-content: space-between; 
    align-items: flex-start; 
    padding: 10px 20px;
}

.nav-links {
    list-style: none;
    display: flex;
    gap: 25px;
    margin: 0;
    padding: 0;
}

.nav-links a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}
  </style>
  </style>
</head>
<body>
  <header class="register-header">

    <nav class="navbar">

        <div class="logo">
            <h1>Society Election System</h1>
        </div>

        <ul class="nav-links">

            <li><a href="index.html">Home</a></li>

            <li><a href="register.html">Register</a></li>

            <li><a href="login.html">Login</a></li>

            <li><a href="polls.html">Polls</a></li>

            <li><a href="contact.html">Contact</a></li>

        </ul>

    </nav>

</header>
<section class="register-section">
    <div class="form-container">

        <h2>Resident Registration</h2>

        <form>

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="flat">Flat/House Number</label>
                <input type="text" id="flat" placeholder="Enter flat number">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" placeholder="Enter mobile number">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create password">
            </div>

            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" placeholder="Confirm password">
            </div>

            <div class="form-group">
                <label for="resident">Resident Type</label>
                <select id="resident">
                    <option>Owner</option>
                    <option>Tenant</option>
                </select>
            </div>

            <button type="submit" class="btn">
                Register
            </button>

        </form>

    </div>
</section>
<footer>

    <p>
        © 2026 Society Election Management System
    </p>

</footer>
</body>
</html>
