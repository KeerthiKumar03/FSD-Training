<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote Page</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>

    <nav class="navbar">

        <div class="logo">
            <h1>Society Election System</h1>
        </div>

    </nav>

</header>

<section class="features">

    <h2>Vote For Your Representative</h2>

    <div class="feature-container">

        <div class="card">

            <img src="images/candidate1.jpg" alt="Candidate" width="100%">

            <h3>Rajesh Kumar</h3>

            <p>Flat No: A-101</p>

            <p>Position: President</p>

            <p>
                Focus on better maintenance and security.
            </p>

            <input type="radio" name="vote">

        </div>

        <div class="card">

            <img src="images/candidate2.jpg" alt="Candidate" width="100%">

            <h3>Anita Sharma</h3>

            <p>Flat No: B-204</p>

            <p>Position: President</p>

            <p>
                Improve community activities and cleanliness.
            </p>

            <input type="radio" name="vote">

        </div>

    </div>

    <br>

    <button class="btn">
        Submit Vote
    </button>

</section>

<footer>

    <p>© 2026 Society Election Management System</p>

</footer>

</body>
</html>
