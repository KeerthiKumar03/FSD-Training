<section class="contact-section">

    <h2>Contact Society Committee</h2>

    <form class="contact-form">

        <label>Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Subject</label>
        <input type="text" placeholder="Enter subject">

        <label>Message</label>
        <textarea rows="5" placeholder="Enter your message"></textarea>

        <button type="submit" class="btn">
            Send Message
        </button>

    </form>

</section>

<section class="office-details">

    <h2>Office Details</h2>

    <p><strong>Address:</strong> Green Valley Society, Hyderabad</p>

    <p><strong>Email:</strong> societyelection@gmail.com</p>

    <p><strong>Phone:</strong> +91 9876543210</p>

    <p><strong>Timings:</strong> 9:00 AM - 6:00 PM</p>

</section>

</footer>
