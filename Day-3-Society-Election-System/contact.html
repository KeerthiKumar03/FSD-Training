<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>

    <nav class="navbar">

        <div class="logo">
            <h1>Society Election System</h1>
        </div>

    </nav>

</header>

<section class="register-section">

    <div class="form-container">

        <h2>Contact Society Committee</h2>

        <form>

            <label>Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Subject</label>
            <input type="text" placeholder="Enter subject">

            <label>Message</label>
            <textarea rows="5" placeholder="Enter message"></textarea>

            <button class="btn">
                Submit
            </button>

        </form>

        <br>

        <h3>Society Office Details</h3>

        <p>Address: Green Valley Society, Hyderabad</p>

        <p>Email: societyelection@gmail.com</p>

        <p>Phone: +91 9876543210</p>

        <p>Office Timings: 9 AM - 6 PM</p>

    </div>

</section>

<footer>

    <p>© 2026 Society Election Management System</p>

</footer>

</body>
</html>
